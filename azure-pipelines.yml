trigger: 
 branches:
   include:
     - main

pool: Default

stages:
- stage: terraforminstallation
  jobs:
  - job: terraforminstallation
    displayName: terraform installation
    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: 'MyServiceConnection01'
        backendAzureRmOverrideSubscriptionID: '0e01e4d0-ef71-4105-81fd-346e52ee7351'
        backendAzureRmResourceGroupName: 'MyRGc'
        backendAzureRmStorageAccountName: 'myrgst5679807578jhj'
        backendAzureRmContainerName: 'myrgccon'
        backendAzureRmKey: 'dev.terraform.tfstate'
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'plan'
        environmentServiceNameAzureRM: 'MyServiceConnection01'
        environmentAzureRmOverrideSubscriptionID: '0e01e4d0-ef71-4105-81fd-346e52ee7351'
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'apply'
        commandOptions: '--auto-approve'
        environmentServiceNameAzureRM: 'MyServiceConnection01'
        environmentAzureRmOverrideSubscriptionID: '0e01e4d0-ef71-4105-81fd-346e52ee7351'