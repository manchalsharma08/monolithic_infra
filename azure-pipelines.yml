trigger: 
 branches:
   include:
     - main

pool: Default

stages:
- stage: terraforminstallation
  jobs:
  - job: terraforminstallation
    displayName: terraform installation
    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: 'ApplicationSC'
        backendAzureRmOverrideSubscriptionID: 'b6571c78-f766-4999-8358-e9602abe50cf'
        backendAzureRmResourceGroupName: 'MyRGc'
        backendAzureRmStorageAccountName: 'myst5679807578jhj'
        backendAzureRmContainerName: 'myrgccon'
        backendAzureRmKey: 'dev.terraform.tfstate'
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'plan'
        environmentServiceNameAzureRM: 'ApplicationSC'
        environmentAzureRmOverrideSubscriptionID: 'b6571c78-f766-4999-8358-e9602abe50cf'
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'apply'
        commandOptions: '--auto-approve'
        environmentServiceNameAzureRM: 'ApplicationSC'
        environmentAzureRmOverrideSubscriptionID: 'b6571c78-f766-4999-8358-e9602abe50cf'